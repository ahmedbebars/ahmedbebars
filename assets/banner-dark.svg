<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ahmed Bebars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- a small network: one core, four nodes -->
  <g stroke="#3DD6B0" stroke-width="1.5" fill="none">
    <path d="M960 150 L870 85 M960 150 L1060 85 M960 150 L870 215 M960 150 L1060 215" opacity="0.5"/>
    <path d="M870 85 L1060 85 M870 215 L1060 215" opacity="0.2"/>
  </g>
  <rect x="932" y="122" width="56" height="56" rx="10" fill="#3DD6B0" opacity="0.12" stroke="#3DD6B0" stroke-width="1.5"/>
  <g fill="#0D1117" stroke="#3DD6B0" stroke-width="1.5">
    <circle cx="870" cy="85" r="12"/>
    <circle cx="1060" cy="85" r="12"/>
    <circle cx="870" cy="215" r="12"/>
    <circle cx="1060" cy="215" r="12"/>
  </g>

  <rect x="80" y="96" width="4" height="108" rx="2" fill="#3DD6B0"/>
  <text x="108" y="140" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Ahmed Bebars</text>
  <text x="110" y="182" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#9198A1">Networks and servers, and the software that runs on them</text>
  <text x="110" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#7D8590">Linux servers &#183; Monitoring &#183; Odoo &#183; Klipper &#183; 3D printers &#183; Arabic &amp; RTL</text>
</svg>
